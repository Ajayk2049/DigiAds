<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" fill="none">
  <defs>
    <linearGradient id="tvBodyGradLogo" x1="98" y1="86" x2="286" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A69F98" />
      <stop offset="55%" stop-color="#6F747D" />
      <stop offset="100%" stop-color="#3E4959" />
    </linearGradient>
    <linearGradient id="tvShadowBarLogo" x1="132" y1="86" x2="160" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2A2422" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#2A2422" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="bezelLeftGradLogo" x1="64" y1="124" x2="306" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E91E63" />
      <stop offset="50%" stop-color="#880E3F" />
      <stop offset="100%" stop-color="#E91E63" />
    </linearGradient>
    <linearGradient id="bezelRightGradLogo" x1="216" y1="66" x2="306" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4A0822" />
      <stop offset="45%" stop-color="#B01552" />
      <stop offset="100%" stop-color="#E91E63" />
    </linearGradient>
  </defs>

  <g transform="translate(8, 0)">
    <!-- Antennas -->
    <path d="M184 52 L162 16 L170 13 L190 50 Z" fill="#E91E63" />
    <circle cx="165" cy="14" r="8.5" fill="#F4793B" stroke="#E91E63" stroke-width="2.5" />
    <path d="M198 62 L220 20 L227 23 L204 65 Z" fill="#E91E63" />
    <circle cx="225" cy="20" r="8.5" fill="#F4793B" stroke="#E91E63" stroke-width="2.5" />

    <!-- Inner TV Screen Body (x: 98..282, y: 86..214) -->
    <rect x="98" y="86" width="184" height="128" rx="18" fill="url(#tvBodyGradLogo)" />
    <rect x="132" y="86" width="28" height="128" fill="url(#tvShadowBarLogo)" />

    <!-- TV Control Cutouts -->
    <rect x="218" y="176" width="22" height="10" rx="3" fill="#181A1F" />
    <circle cx="256" cy="181" r="8" fill="#181A1F" />

    <!-- Unified Outer Magenta TV Enclosure (single continuous bezel; yellow play triangle overlaps it) -->
    <path
      d="M64 124 C66 84 86 66 122 66 L264 66 C292 66 306 82 306 112 L306 184 C306 216 290 232 260 234 C279 218 289 202 289 178 L289 114 C289 91 279 80 260 80 L122 80 C94 80 78 92 64 124 Z"
      fill="url(#bezelLeftGradLogo)"
    />

    <!-- Bold Yellow Play Triangle Overlay -->
    <path
      d="M124 68 C124 50 142 40 156 50 L248 116 C262 126 262 148 248 158 L156 224 C142 234 124 224 124 206 Z"
      fill="none"
      stroke="#ECE132"
      stroke-width="22"
      stroke-linejoin="round"
    />
  </g>

  <!-- Brand Wordmark -->
  <text
    x="200"
    y="280"
    text-anchor="middle"
    font-family="Outfit, 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
    font-size="44"
    font-weight="500"
    letter-spacing="6"
    fill="#7E7972"
  >DIGI ADS</text>

  <!-- Tagline -->
  <text
    x="200"
    y="318"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', Times, serif"
    font-size="23"
    font-weight="700"
    letter-spacing="1.5"
    fill="#D81B60"
  >TOUCHING THE HEARTS</text>
</svg>
