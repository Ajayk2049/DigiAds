<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="tvBodyGrad" x1="68" y1="86" x2="196" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A69F98" />
      <stop offset="55%" stop-color="#6F747D" />
      <stop offset="100%" stop-color="#3E4959" />
    </linearGradient>
    <linearGradient id="tvShadowBar" x1="92" y1="86" x2="114" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2A2422" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#2A2422" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="bezelLeftGrad" x1="44" y1="114" x2="214" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E91E63" />
      <stop offset="50%" stop-color="#880E3F" />
      <stop offset="100%" stop-color="#E91E63" />
    </linearGradient>
    <linearGradient id="bezelRightGrad" x1="152" y1="68" x2="212" y2="202" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4A0822" />
      <stop offset="45%" stop-color="#B01552" />
      <stop offset="100%" stop-color="#E91E63" />
    </linearGradient>
  </defs>

  <g transform="translate(0, 14)">
    <!-- Antennas -->
    <path d="M126 56 L109 24 L115 22 L131 54 Z" fill="#E91E63" />
    <circle cx="111" cy="22" r="7" fill="#F4793B" stroke="#E91E63" stroke-width="2.5" />
    <path d="M137 64 L154 27 L160 30 L142 67 Z" fill="#E91E63" />
    <circle cx="158" cy="27" r="7" fill="#F4793B" stroke="#E91E63" stroke-width="2.5" />

    <!-- Inner TV Screen Body (x: 68..196, y: 86..190) -->
    <rect x="68" y="86" width="128" height="104" rx="15" fill="url(#tvBodyGrad)" />
    <rect x="92" y="86" width="22" height="104" fill="url(#tvShadowBar)" />

    <!-- TV Control Cutouts -->
    <rect x="150" y="158" width="16" height="8" rx="2.5" fill="#181A1F" />
    <circle cx="177" cy="162" r="6.5" fill="#181A1F" />

    <!-- Unified Outer Magenta TV Enclosure (single continuous bezel; yellow play triangle overlaps it) -->
    <path
      d="M44 114 C46 84 60 70 86 70 L184 70 C204 70 214 82 214 104 L214 166 C214 190 202 203 180 204 C194 192 201 180 201 162 L201 106 C201 89 194 81 180 81 L86 81 C66 81 55 90 44 114 Z"
      fill="url(#bezelLeftGrad)"
    />

    <!-- Bold Yellow Play Triangle Overlay (occludes the bezel where it crosses) -->
    <path
      d="M84 70 C84 55 98 47 110 55 L174 101 C186 110 186 128 174 137 L110 183 C98 191 84 183 84 168 Z"
      fill="none"
      stroke="#ECE132"
      stroke-width="18"
      stroke-linejoin="round"
    />
  </g>
</svg>
